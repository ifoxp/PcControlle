[project]
name = "pc_control_remote"
version = "1.0.0"
description = "PC Control — пульт керування ПК"
requires-python = ">=3.9"
dependencies = [
    "flet>=0.24",
    "httpx",
]

[tool.flet]
# Метадані застосунку
org = "com.shramix"
product = "PC Control"
company = "ShrAmix"
copyright = "Copyright (C) 2026"

[tool.flet.app]
path = "."

# Іконки (Flet бере з assets/): icon.png — основна, icon_foreground/monochrome —
# для Android adaptive + themed icons (перефарбовування як на Pixel).
[tool.flet.android]
adaptive_icon_background = "#0f1116"

# Deep-link: скан QR (pccontrol://pair?...) камерою відкриває цей додаток
[tool.flet.deep_linking]
scheme = "pccontrol"
host = "pair"

# Дозволи Android: зберігати медіа в Downloads, доступ до сховища, вибір файлів
# (READ_MEDIA_* — для FilePicker на Android 13+, де READ_EXTERNAL_STORAGE вже не діє).
[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.READ_MEDIA_IMAGES" = true
"android.permission.READ_MEDIA_VIDEO" = true
"android.permission.READ_MEDIA_AUDIO" = true
